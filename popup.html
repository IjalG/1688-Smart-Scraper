<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }
body {
  width: 260px;
  padding: 15px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.main-view, .settings-view {
  display: none;
}
.main-view.active, .settings-view.active {
  display: block;
}
button {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  background: #ff6600;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin-bottom: 8px;
}
button:hover {
  background: #e55a00;
}
button:disabled {
  background: #ccc;
  cursor: not-allowed;
}
button.secondary {
  background: #f5f5f5;
  color: #333;
  border: 1px solid #ddd;
}
button.secondary:hover {
  background: #e8e8e8;
}
button.collection {
  background: #4a90d9;
}
button.collection:hover {
  background: #357abd;
}
.status {
  margin-top: 10px;
  font-size: 12px;
  color: #666;
  text-align: center;
}
.error {
  color: #d00;
}
.settings-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #333;
}
.setting-item {
  margin-bottom: 15px;
}
.setting-item label {
  display: block;
  font-size: 13px;
  color: #333;
  margin-bottom: 5px;
}
.setting-item select, .setting-item input[type="number"],
.setting-item input[type="text"], .setting-item input[type="password"] {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
}
.setting-item input[type="checkbox"] {
  margin-right: 8px;
}
.checkbox-label {
  display: flex;
  align-items: center;
  font-size: 13px;
  cursor: pointer;
}
.button-row {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
.button-row button {
  flex: 1;
  margin-bottom: 0;
}
.collection-badge {
  display: inline-block;
  background: #fff;
  color: #ff6600;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: bold;
}
.folder-select {
  margin-top: -4px;
  margin-bottom: 8px;
}
.folder-select select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 12px;
  background: #fafafa;
  color: #333;
  cursor: pointer;
}
.folder-select select:focus {
  outline: none;
  border-color: #4a90d9;
}
.column-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.column-grid label {
  display: flex;
  align-items: center;
  font-size: 12px;
  cursor: pointer;
}
.divider {
  height: 1px;
  background: #eee;
  margin: 12px 0;
}
</style>
</head>
<body>
<!-- 主视图 -->
<div class="main-view active" id="mainView">
  <button id="addToCollectionBtn" class="collection">加入收藏夹</button>
  <div class="folder-select" id="folderSelectWrap" style="display: none;">
    <select id="popupFolderSelect"></select>
  </div>
  <button id="selectBtn">选取导出</button>
  <button id="openCollectionBtn" class="secondary">查看收藏夹 <span class="collection-badge" id="collectionBadge">0</span></button>
  <button id="aiRepairBtn" class="secondary">开始 AI 修复</button>
  <button id="settingsBtn" class="secondary">设置</button>
  <div class="status" id="status"></div>
  <div class="status" id="aiHint" style="display:none; color:#b35c00;"></div>
</div>

<!-- 设置视图 -->
<div class="settings-view" id="settingsView">
  <div class="settings-title">设置</div>

  <div class="setting-item">
    <label>导出格式</label>
    <select id="exportFormat">
      <option value="xlsx">XLSX (Excel)</option>
      <option value="markdown">Markdown</option>
    </select>
  </div>

  <div class="setting-item">
    <label>抓取数量 (0 = 全部)</label>
    <input type="number" id="maxProducts" min="0" max="1000" value="0">
  </div>

  <div class="setting-item">
    <label class="checkbox-label">
      <input type="checkbox" id="filterAds" checked>
      过滤广告商品
    </label>
  </div>

  <div class="setting-item">
    <label>Excel 图片尺寸</label>
    <select id="imageSize">
      <option value="80">小 (80px)</option>
      <option value="120" selected>中 (120px)</option>
      <option value="160">大 (160px)</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="setting-item">
    <label>语言</label>
    <select id="language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="setting-item">
    <label>AI API Key（可选，仅手动修复时使用）</label>
    <input type="password" id="aiApiKey" placeholder="sk-..." autocomplete="off">
  </div>
  <div class="setting-item">
    <label>AI Base URL</label>
    <input type="text" id="aiBaseUrl" placeholder="https://api.openai.com/v1">
  </div>
  <div class="setting-item">
    <label>AI Model</label>
    <input type="text" id="aiModel" placeholder="gpt-4o-mini">
  </div>
  <div class="setting-item">
    <button id="clearAiRulesBtn" class="secondary" type="button">清除 AI 规则 / 回退内置</button>
  </div>

  <div class="setting-item">
    <label>导出字段</label>
    <div class="column-grid">
      <label><input type="checkbox" id="col_序号" checked> 序号</label>
      <label><input type="checkbox" id="col_图片" checked> 图片</label>
      <label><input type="checkbox" id="col_商品标题" checked> 商品标题</label>
      <label><input type="checkbox" id="col_价格" checked> 价格</label>
      <label><input type="checkbox" id="col_销量" checked> 销量</label>
      <label><input type="checkbox" id="col_店铺名称" checked> 店铺名称</label>
      <label><input type="checkbox" id="col_商品链接" checked> 商品链接</label>
    </div>
  </div>

  <div class="button-row">
    <button id="saveSettingsBtn">保存</button>
    <button id="cancelSettingsBtn" class="secondary">取消</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
