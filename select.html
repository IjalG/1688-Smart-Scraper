<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1688 商品选择</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f5f5;
  height: 100vh;
  display: flex;
}
.container {
  display: flex;
  width: 100%;
  height: 100%;
}
.left-panel {
  width: 360px;
  background: #fff;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #e0e0e0;
  flex-shrink: 0;
}
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
}
.header {
  padding: 15px 20px;
  background: linear-gradient(135deg, #ff6600 0%, #ff8533 100%);
  color: white;
}
.header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: bold;
}
.header-sub {
  font-size: 12px;
  opacity: 0.9;
  margin-top: 4px;
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid #eee;
  background: #fafafa;
}
.select-count {
  font-size: 13px;
  color: #ff6600;
  font-weight: bold;
}
.toolbar-actions {
  display: flex;
  gap: 8px;
}
.toolbar-actions button {
  padding: 6px 12px;
  font-size: 12px;
  background: #fff;
  color: #333;
  border: 1px solid #ddd;
  border-radius: 4px;
  cursor: pointer;
}
.toolbar-actions button:hover {
  background: #f5f5f5;
}
.product-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.product-item {
  display: flex;
  align-items: flex-start;
  padding: 12px;
  border: 1px solid #eee;
  border-radius: 8px;
  margin-bottom: 10px;
  background: #fff;
  cursor: pointer;
  transition: all 0.2s;
}
.product-item:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.product-item.selected {
  border-color: #ff6600;
  background: #fff8f5;
}
.product-item input[type="checkbox"] {
  margin-right: 10px;
  margin-top: 5px;
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.product-thumb {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 6px;
  margin-right: 12px;
  flex-shrink: 0;
  background: #f5f5f5;
}
.product-info {
  flex: 1;
  min-width: 0;
}
.product-title {
  font-size: 13px;
  color: #333;
  margin-bottom: 6px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.product-meta {
  font-size: 12px;
  color: #999;
  margin-bottom: 4px;
}
.product-price {
  color: #ff6600;
  font-weight: bold;
  font-size: 14px;
}
.product-shop {
  font-size: 11px;
  color: #888;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.footer {
  padding: 15px;
  border-top: 1px solid #eee;
  background: #fafafa;
}
.footer button {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  background: #ff6600;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.footer button:hover {
  background: #e55a00;
}
.footer button:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.preview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: #fafafa;
  border-bottom: 1px solid #eee;
}
.preview-title {
  font-size: 14px;
  color: #333;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  margin-right: 15px;
}
.preview-actions a {
  font-size: 13px;
  color: #ff6600;
  text-decoration: none;
  white-space: nowrap;
}
.preview-actions a:hover {
  text-decoration: underline;
}
.preview-frame {
  flex: 1;
  border: none;
  background: #fff;
  width: 100%;
}
.preview-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #999;
  background: #fafafa;
}
.preview-placeholder-icon {
  font-size: 48px;
  margin-bottom: 15px;
  opacity: 0.5;
}
.preview-placeholder-text {
  font-size: 14px;
}
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #f0f0f0;
  border-top-color: #ff6600;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  margin-top: 15px;
  font-size: 14px;
  color: #666;
}
.status-bar {
  padding: 10px 15px;
  background: #fff8f5;
  border-top: 1px solid #ffe0cc;
  font-size: 12px;
  color: #ff6600;
  text-align: center;
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在加载商品数据...</div>
</div>

<div class="container" id="mainContainer" style="display: none;">
  <div class="left-panel">
    <div class="header">
      <h1>1688 商品选择</h1>
      <div class="header-sub">点击商品可在右侧查看详情</div>
    </div>
    
    <div class="toolbar">
      <span class="select-count" id="selectCount">已选: 0 个商品</span>
      <div class="toolbar-actions">
        <button id="selectAllBtn">全选</button>
        <button id="deselectAllBtn">取消全选</button>
      </div>
    </div>
    
    <div class="product-list" id="productList"></div>
    
    <div class="footer">
      <button id="exportBtn">导出选中的商品</button>
    </div>
  </div>
  
  <div class="right-panel">
    <div class="preview-header">
      <span class="preview-title" id="previewTitle">请点击左侧商品查看详情</span>
      <div class="preview-actions">
        <a href="#" id="openInNewTab" target="_blank" style="display: none;">在新标签页打开 ↗</a>
      </div>
    </div>
    <div class="preview-placeholder" id="previewPlaceholder">
      <div class="preview-placeholder-icon">📦</div>
      <div class="preview-placeholder-text">请点击左侧商品查看详情</div>
    </div>
    <iframe class="preview-frame" id="previewFrame" style="display: none;"></iframe>
  </div>
</div>

<script src="select.js"></script>
</body>
</html>
